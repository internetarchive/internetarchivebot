name: codespell
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: codespell-project/actions-codespell@master
        with:
          ignore_words_list: cant,fo,inbetween,nam,numer
          skip: "*.css,*fr.html,*.js,*.json,*.lock,*.map,localization.php"
